<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="master.css">
</head>
<body>
    <form action="">
        
        <input type="number" name="elements" 
        class="input" placeholder="Number Of Elements" />

        <input type="text" name="texts" 
        class="input" placeholder="Elements Text" />

        <select name="type" class="input">
          <option value="Div">Div</option>
          <option value="Section">Section</option>
        </select>

        <div>
          <label for="bg-color">Choose Background Color</label>
          <input id="bg-color" type="color" name="bg-color" value="#fc5626">
        </div>

        <div>
          <label for="txt-color">Choose Text Color</label>
          <input id="txt-color" type="color" name="txt-color" value="#ffffff">
        </div>

        <input type="submit" name="create" 
        value="Create" />

        <div class="results"></div>

      </form>
    <script src="main.js"></script>
</body>
</html>
